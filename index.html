<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bharatiya Pasha</title>
    <link rel="stylesheet" href="style.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Yatra+One&display=swap" rel="stylesheet">
    <!-- Font Awesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <!-- Premium Navigation Bar -->
    <header class="navbar">
        <div class="brand">
            <i class="fa-solid fa-dharmachakra logo-icon"></i>
            <div class="logo-text">
                <h1>Bharatiya Pasha</h1>
                <p>The Ancient Epic</p>
            </div>
        </div>
        
        <ul class="nav-links" id="nav-links">
            <li><a href="#" class="nav-btn" data-target="home-tab">Home</a></li>
            <li><a href="#" class="nav-btn active" data-target="game-tab">Play</a></li>
            <li><a href="#" class="nav-btn" data-target="rules-tab">Rules</a></li>
            <li><a href="#" class="nav-btn" data-target="heritage-tab">Heritage</a></li>
            <li><a href="#" id="my-projects-btn">My Projects</a></li>
        </ul>
        
        <button class="login-btn">Login/Register</button>
        
        <div class="hamburger" id="hamburger">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
        </div>
    </header>

    <main class="main-content">
        <!-- GAME TAB (Mobile & Desktop Responsive UI) -->
        <section id="game-tab" class="tab-section active">
            <div class="hero game-bg">
                <div class="game-ui-wrapper">
                    
                    <!-- TOP/LEFT PANEL (Player 1 & 3) -->
                    <div class="side-panel left-panel">
                        <div class="top-players-row">
                            <div class="player-card active-turn">
                                <div class="player-info">
                                    <h4>YOUR TURN</h4>
                                    <div class="avatar-box">
                                        <i class="fa-solid fa-user"></i>
                                    </div>
                                </div>
                                <div class="token-icon token-red"></div>
                            </div>
                            
                            <div class="turn-status-box mobile-hide">
                                <h3 id="turn-indicator" class="turn-text">YOUR TURN'S MOVE</h3>
                            </div>

                            <div class="player-card">
                                <div class="player-info">
                                    <h4>PLAYER 3</h4>
                                    <div class="avatar-box">
                                        <i class="fa-solid fa-user"></i>
                                    </div>
                                </div>
                                <div class="token-icon token-yellow"></div>
                            </div>
                        </div>
                        <div class="turn-status-box desktop-hide">
                            <h3 id="turn-indicator-mobile" class="turn-text">YOUR TURN'S MOVE</h3>
                        </div>
                    </div>

                    <!-- CENTER PANEL (The Board) -->
                    <div class="center-panel">
                        <div class="board-ornate-border">
                            <div class="board">
                                <div class="arm vertical-arm top-arm" id="black-arm"></div>
                                <div class="arm horizontal-arm left-arm" id="yellow-arm"></div>
                                <div class="center-home"><span>HOME</span></div>
                                <div class="arm horizontal-arm right-arm" id="green-arm"></div>
                                <div class="arm vertical-arm bottom-arm" id="red-arm"></div>
                            </div>
                        </div>
                    </div>

                    <!-- BOTTOM/RIGHT PANEL (Player 2, Dice, Player 4, Chat) -->
                    <div class="side-panel right-panel">
                        
                        <div class="player-card">
                            <div class="player-info">
                                <h4>PLAYER 2</h4>
                                <div class="avatar-box">
                                    <i class="fa-solid fa-user"></i>
                                </div>
                            </div>
                            <div class="token-icon token-green"></div>
                        </div>

                        <!-- Dice Panel (Horizontal Layout like the screenshot) -->
                        <div class="dice-panel">
                            <div class="bowl oval-bowl">
                                <div class="pasha" id="pasha-1"><div class="dot-container" id="dot-container-1"></div></div>
                                <div class="pasha" id="pasha-2"><div class="dot-container" id="dot-container-2"></div></div>
                            </div>
                            
                            <div class="dice-action">
                                <button id="roll-dice-btn" class="royal-btn">ROLL PASHA</button>
                            </div>

                            <div class="dice-text">
                                <p id="dice-result">Roll Pasha<br>to move.</p>
                            </div>
                        </div>

                        <div class="player-card">
                            <div class="player-info">
                                <h4>PLAYER 4</h4>
                                <div class="avatar-box">
                                    <i class="fa-solid fa-user"></i>
                                </div>
                            </div>
                            <div class="token-icon token-black"></div>
                        </div>

                        <!-- Chat Box -->
                        <div class="chat-box">
                            <div class="chat-header">Chat <i class="fa-solid fa-comment"></i></div>
                            <div class="chat-messages">
                                <p><strong>Player 2:</strong> Good luck!</p>
                            </div>
                            <div class="chat-input-area">
                                <input type="text" placeholder="Chat here...">
                                <button><i class="fa-solid fa-paper-plane"></i></button>
                            </div>
                        </div>

                    </div>
                </div>
            </div>
        </section>

        <!-- (Keep your other sections like #home-tab, #rules-tab here from previous code) -->
    </main>

    <script src="script.js"></script>
</body>
</html>
