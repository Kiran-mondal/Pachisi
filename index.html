<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pachisi - The Ancient Epic (3D)</title>
    
    <!-- 🌟 Reliable Three.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="game/game.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Yatra+One&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header class="navbar">
        <div class="brand">
            <i class="fa-solid fa-dharmachakra logo-icon" aria-hidden="true"></i>
            <div class="logo-text">
                <h1>Pachisi</h1>
                <p>The Ancient Epic</p>
            </div>
        </div>
        
        <ul class="nav-links" id="nav-links">
            <li><a href="#" class="nav-btn active" data-target="home-tab">Home</a></li>
            <li><a href="#" class="nav-btn" data-target="game-tab">Play</a></li>
            <li><a href="#" class="nav-btn" data-target="rules-tab">Rules</a></li>
            <li><a href="#" class="nav-btn" data-target="heritage-tab">Heritage</a></li>
            <li><a href="projects/index.html" onclick="window.location.href='projects/index.html'; return false;">My Projects</a></li>
        </ul>
        
        <button class="hamburger" id="hamburger" aria-label="Toggle menu">
            <span class="bar"></span><span class="bar"></span><span class="bar"></span>
        </button>
    </header>

    <main class="main-content">
        <!-- HOME TAB -->
        <section id="home-tab" class="tab-section active">
            <div class="hero">
                <div class="hero-content">
                    <h2>The World of Traditional<br>Indian Pachisi</h2>
                    <button class="play-now-btn nav-btn" data-target="game-tab">Play Game 3D</button>
                </div>
            </div>
        </section>

        <!-- GAME TAB -->
        <section id="game-tab" class="tab-section">
            <div class="hero game-bg">
                <!-- SETUP SCREEN -->
                <div id="game-setup-screen" class="setup-container">
                    <div class="content-box setup-box">
                        <h2>Game Settings</h2>
                        <button id="start-game-btn" class="royal-btn start-btn">START EPIC BATTLE</button>
                    </div>
                </div>

                <!-- ACTUAL GAME UI -->
                <div id="actual-game-screen" class="game-ui-wrapper" style="display: none; flex-direction: column; width: 100%;">
                    <div class="turn-status-box">
                        <h3 id="turn-indicator" class="turn-text">YOUR TURN'S MOVE</h3>
                    </div>

                    <!-- 🌟 3D Canvas -->
                    <div class="center-panel" style="width: 100%; height: 50vh; min-height: 350px; position: relative;">
                        <div id="three-canvas-container" style="width: 100%; height: 100%; border: 2px solid #dcb360; border-radius: 8px; background: #000; overflow: hidden;"></div>
                    </div>

                    <div class="bottom-panel">
                        <div class="dice-panel">
                            <div class="dice-action">
                                <button id="roll-dice-btn" class="royal-btn">ROLL PASHA</button>
                            </div>
                            <div class="dice-text">
                                <p id="dice-result">Roll Pasha<br>to move.</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- RULES TAB -->
        <section id="rules-tab" class="tab-section">
            <div class="page-content"><div class="content-box"><h2>Rules of Pachisi</h2><p>Coming Soon...</p></div></div>
        </section>

        <!-- HERITAGE TAB -->
        <section id="heritage-tab" class="tab-section">
            <div class="page-content"><div class="content-box"><h2>The Royal Heritage</h2><p>Coming Soon...</p></div></div>
        </section>
    </main>

    <script src="script.js"></script>
    <script src="game/game.js"></script>
</body>
</html>
