<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Pachisi - 3D Board</title>
    
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    
    <!-- 🌟 가장 Reliable Three.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="game/game.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Yatra+One&display=swap" rel="stylesheet">
</head>
<body>
    <header class="navbar">
        <div class="brand">
            <div class="logo-text"><h1>Pachisi</h1></div>
        </div>
        <ul class="nav-links" id="nav-links">
            <li><a href="#" class="nav-btn active" data-target="home-tab">Home</a></li>
            <li><a href="#" class="nav-btn" data-target="game-tab">Play</a></li>
            <li><a href="projects/index.html">My Projects</a></li>
        </ul>
    </header>

    <main class="main-content">
        <section id="home-tab" class="tab-section active">
            <div class="hero">
                <div class="hero-content">
                    <h2>Traditional Pachisi 3D</h2>
                    <button class="play-now-btn nav-btn" data-target="game-tab">Play Game 3D</button>
                </div>
            </div>
        </section>

        <section id="game-tab" class="tab-section">
            <div class="hero game-bg">
                <div id="game-setup-screen" class="setup-container">
                    <div class="content-box setup-box">
                        <h2>Game Settings</h2>
                        <button id="start-game-btn" class="royal-btn start-btn">START EPIC BATTLE</button>
                    </div>
                </div>

                <div id="actual-game-screen" style="display: none; flex-direction: column; width: 100%; align-items: center; margin-top: 20px;">
                    <h3 style="color: red; margin-bottom: 10px;">YOUR TURN'S MOVE</h3>
                    
                    <!-- 🌟 হার্ডকোড করা ডাইমেনশন (যাতে মোবাইলে 0x0 না হয়ে যায়) 🌟 -->
                    <div id="three-canvas-container" style="width: 350px; height: 350px; border: 2px solid #dcb360; background: #111;"></div>

                    <div style="margin-top: 15px; text-align: center;">
                        <button id="roll-dice-btn" class="royal-btn" style="padding: 10px 20px;">ROLL PASHA</button>
                        <p id="dice-result" style="color: white; margin-top: 10px;">Roll Pasha to move.</p>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <!-- স্ক্রিপ্টের সঠিক সিরিয়াল -->
    <script src="game/game.js"></script>
    <script src="script.js"></script>
</body>
</html>
