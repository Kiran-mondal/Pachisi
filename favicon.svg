<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <mask id="center-hole">
      <!-- সাদা অংশগুলো দেখা যাবে, কালো অংশটি স্বচ্ছ (transparent) হয়ে যাবে -->
      <rect width="512" height="512" fill="white" />
      <circle cx="256" cy="256" r="32" fill="black" />
    </mask>
  </defs>
  
  <g mask="url(#center-hole)" fill="#7a1f1f">
    <!-- ৮টি স্পোক (৪টি লম্বালম্বি লাইন দিয়ে তৈরি) -->
    <rect x="232" y="16" width="48" height="480" rx="12" />
    <rect x="232" y="16" width="48" height="480" rx="12" transform="rotate(45 256 256)" />
    <rect x="232" y="16" width="48" height="480" rx="12" transform="rotate(90 256 256)" />
    <rect x="232" y="16" width="48" height="480" rx="12" transform="rotate(135 256 256)" />
    
    <!-- বাইরের মোটা রিং (Outer Ring) -->
    <circle cx="256" cy="256" r="168" fill="none" stroke="#7a1f1f" stroke-width="48" />
    
    <!-- ভেতরের কেন্দ্র (Inner Hub) -->
    <circle cx="256" cy="256" r="56" fill="none" stroke="#7a1f1f" stroke-width="48" />
  </g>
</svg>
